name: ohmybuying-local

networks:
  ohmybuying:
    driver: bridge

services:
  db:
    image: postgres:15-alpine
    container_name: ohmybuying_db
    restart: unless-stopped
    networks:
      - ohmybuying
    ports:
      - '54322:5432'
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: postgres
    volumes:
      - db-data:/var/lib/postgresql/data
      # Bootstrap Supabase-style roles + the auth helper functions before our
      # app schema runs. Stock postgres processes /docker-entrypoint-initdb.d/*
      # in alphabetical order on first boot only.
      - ./db/init/00-roles.sql:/docker-entrypoint-initdb.d/00-roles.sql:ro
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres -d postgres']
      interval: 3s
      timeout: 3s
      retries: 30
      start_period: 10s

  auth:
    image: supabase/gotrue:v2.158.1
    container_name: ohmybuying_auth
    restart: unless-stopped
    networks:
      - ohmybuying
    depends_on:
      db:
        condition: service_healthy
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: http://localhost:8000
      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@db:5432/postgres?search_path=auth
      GOTRUE_SITE_URL: http://localhost:5173
      GOTRUE_URI_ALLOW_LIST: 'http://localhost:5173,http://localhost:4173'
      GOTRUE_DISABLE_SIGNUP: 'false'
      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: 3600
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_EXTERNAL_EMAIL_ENABLED: 'true'
      GOTRUE_MAILER_AUTOCONFIRM: 'true'
      GOTRUE_SMTP_ADMIN_EMAIL: admin@ohmybuying.local
      GOTRUE_SMTP_HOST: ''
      GOTRUE_SMTP_PORT: '0'

  migrate:
    image: postgres:15-alpine
    container_name: ohmybuying_migrate
    networks:
      - ohmybuying
    depends_on:
      db:
        condition: service_healthy
      auth:
        condition: service_started
    restart: 'no'
    environment:
      DATABASE_URL: postgres://postgres:${POSTGRES_PASSWORD}@db:5432/postgres
    entrypoint: ['/bin/sh', '/migrate/run.sh']
    volumes:
      - ./db/migrate/run.sh:/migrate/run.sh:ro
      - ./db/migrate/schema.sql:/sql/schema.sql:ro

  rest:
    image: postgrest/postgrest:v12.2.3
    container_name: ohmybuying_rest
    restart: unless-stopped
    networks:
      - ohmybuying
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@db:5432/postgres
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_DB_USE_LEGACY_GUCS: 'false'
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: 3600

  kong:
    image: kong:3.4
    container_name: ohmybuying_kong
    restart: unless-stopped
    networks:
      - ohmybuying
    depends_on:
      - auth
      - rest
    ports:
      # Single entrypoint that mirrors a Supabase project URL.
      # supabase-js will hit http://localhost:8000 for /auth/v1 and /rest/v1.
      - '8000:8000'
    environment:
      KONG_DATABASE: 'off'
      KONG_DECLARATIVE_CONFIG: /home/kong/kong.yml
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_PLUGINS: request-transformer,cors,key-auth,acl
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
    volumes:
      - ./kong/kong.yml:/home/kong/kong.yml:ro

  studio:
    image: supabase/studio:20241014-c083b3b
    container_name: ohmybuying_studio
    restart: unless-stopped
    networks:
      - ohmybuying
    depends_on:
      - kong
    ports:
      - '54323:3000'
    environment:
      STUDIO_PG_META_URL: http://meta:8080
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DEFAULT_ORGANIZATION_NAME: ohMyBuying
      DEFAULT_PROJECT_NAME: ohmybuying-local
      SUPABASE_URL: http://kong:8000
      SUPABASE_PUBLIC_URL: http://localhost:8000
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}

  meta:
    image: supabase/postgres-meta:v0.84.2
    container_name: ohmybuying_meta
    restart: unless-stopped
    networks:
      - ohmybuying
    depends_on:
      db:
        condition: service_healthy
    environment:
      PG_META_PORT: 8080
      PG_META_DB_HOST: db
      PG_META_DB_PORT: 5432
      PG_META_DB_NAME: postgres
      PG_META_DB_USER: postgres
      PG_META_DB_PASSWORD: ${POSTGRES_PASSWORD}

volumes:
  db-data:
