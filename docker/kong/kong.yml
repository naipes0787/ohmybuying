_format_version: '2.1'
_transform: true

# Routes that mirror a real Supabase project URL.
# supabase-js calls /auth/v1/* and /rest/v1/*; we strip those prefixes and
# forward to the GoTrue and PostgREST containers respectively.

services:
  - name: auth-v1
    url: http://auth:9999
    routes:
      - name: auth-v1-route
        strip_path: true
        paths:
          - /auth/v1/

  - name: rest-v1
    url: http://rest:3000
    routes:
      - name: rest-v1-route
        strip_path: true
        paths:
          - /rest/v1/

plugins:
  - name: cors
    config:
      origins:
        - 'http://localhost:5173'
        - 'http://localhost:4173'
        - 'http://localhost:54323'
      methods:
        - GET
        - POST
        - PATCH
        - PUT
        - DELETE
        - OPTIONS
      headers:
        - Accept
        - Accept-Profile
        - Authorization
        - Content-Profile
        - Content-Type
        - apikey
        - x-client-info
        - x-supabase-api-version
        - prefer
        - range
      exposed_headers:
        - Content-Range
        - Content-Profile
      credentials: true
      max_age: 3600
