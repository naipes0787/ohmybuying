<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192" width="192" height="192">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#181826"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="192" height="192" fill="url(#bg)"/>
  <g stroke="#1e1e2e" stroke-width="1">
    <line x1="0"  y1="48"  x2="192" y2="48"/>
    <line x1="0"  y1="96"  x2="192" y2="96"/>
    <line x1="0"  y1="144" x2="192" y2="144"/>
    <line x1="48"  y1="0" x2="48"  y2="192"/>
    <line x1="96"  y1="0" x2="96"  y2="192"/>
    <line x1="144" y1="0" x2="144" y2="192"/>
  </g>
  <g font-family="Space Grotesk, sans-serif" font-weight="700" filter="url(#glow)">
    <text x="96" y="100" text-anchor="middle" font-size="56" fill="#00f5ff">oh</text>
    <text x="96" y="156" text-anchor="middle" font-size="32" fill="#ff007f">My</text>
  </g>
  <rect x="6" y="6" width="180" height="180" fill="none" stroke="#00f5ff" stroke-width="2" opacity="0.6"/>
</svg>
