<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0a0a0f"/>
      <stop offset="100%" stop-color="#181826"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="512" height="512" fill="url(#bg)"/>
  <g stroke="#1e1e2e" stroke-width="1">
    <line x1="0" y1="128" x2="512" y2="128"/>
    <line x1="0" y1="256" x2="512" y2="256"/>
    <line x1="0" y1="384" x2="512" y2="384"/>
    <line x1="128" y1="0" x2="128" y2="512"/>
    <line x1="256" y1="0" x2="256" y2="512"/>
    <line x1="384" y1="0" x2="384" y2="512"/>
  </g>
  <g font-family="Space Grotesk, sans-serif" font-weight="700" filter="url(#glow)">
    <text x="256" y="270" text-anchor="middle" font-size="150" fill="#00f5ff">oh</text>
    <text x="256" y="420" text-anchor="middle" font-size="86" fill="#ff007f">My</text>
  </g>
  <rect x="16" y="16" width="480" height="480" fill="none" stroke="#00f5ff" stroke-width="4" opacity="0.6"/>
</svg>
